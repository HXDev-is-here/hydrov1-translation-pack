name: Language request
description: Ask for a new language, or offer to translate one
title: "Language: "
labels: [language-request]
body:
  - type: input
    id: language
    attributes:
      label: Language
      description: "Name and code, for example German (de) or Portuguese - Brazil (pt-BR)"
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Can you translate it?
      options:
        - Yes, I will open a pull request
        - I can review a translation
        - No, I am only requesting it
    validations:
      required: true
